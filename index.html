<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像マーカー</title>
<style>
  :root { --gap: 12px; }
  body {
    font-family: system-ui, "Segoe UI", "Meiryo", sans-serif;
    margin: 0;
    padding: var(--gap);
    background: #f4f4f5;
    color: #222;
  }
  h1 { font-size: 16px; margin: 0 0 var(--gap); }

  /* ツールバー（スクロールしても上に固定） */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: var(--gap);
    position: sticky;
    top: 0;
    z-index: 10;
    background: #f4f4f5;
    padding: var(--gap) 0;
    border-bottom: 1px solid #e0e0e0;
  }
  .toolbar button,
  .toolbar label {
    font-size: 14px;
    padding: 7px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    user-select: none;
  }
  .toolbar button:hover,
  .toolbar label:hover { background: #f0f0f0; }
  .toolbar button:disabled { opacity: .4; cursor: default; }

  /* ツール＋開始値の入力欄を1組にまとめる */
  .toolgroup {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 6px 3px 3px;
    border: 2px solid #ccc;
    border-radius: 24px;
    background: #fff;
  }
  .toolbar .tool {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 16px;
    background: transparent;
  }
  .toolbar .tool:hover { background: transparent; }
  /* ツール名（丸の右に小さく） */
  .tool-name {
    font-size: 11px;
    font-weight: bold;
    color: var(--c);
    white-space: nowrap;
  }
  .is-star .tool-name { color: #a87800; }   /* 黄色そのままだと白地で読みにくい */
  /* テキスト入力：名前の下に操作の案内を添える */
  .is-text .tool-name { line-height: 1.2; text-align: left; }
  .tool-name small { display: block; font-size: 9px; font-weight: normal; color: #777; }

  /* 選択中のツール：その色の枠＋薄い色の背景。選ばれていない組は淡くする */
  .toolgroup { --c: #888; --bg: #f4f4f5; opacity: .5; transition: opacity .15s; }
  .toolgroup:hover { opacity: .8; }
  .toolgroup:has(.is-active) {
    opacity: 1;
    border: 2px solid var(--c);
    background: var(--bg);
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .toolgroup.is-star  { --c: #f0b400; --bg: #fff7d6; }
  .toolgroup.is-red   { --c: #e00000; --bg: #ffe3e3; }
  .toolgroup.is-blue  { --c: #1976d2; --bg: #e3f0ff; }
  .toolgroup.is-pink  { --c: #ec4098; --bg: #ffe3f3; }
  .toolgroup.is-pinkline { --c: #ec4098; --bg: #ffe3f3; }
  .toolgroup.is-green { --c: #2ea043; --bg: #e3ffe6; }
  .toolgroup.is-text  { --c: #333;    --bg: #ececee; }

  /* 実際に置かれるマークと同じ見た目の丸（中身は開始値） */
  .dot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 28px;
    height: 28px;
    padding: 0 4px;
    box-sizing: border-box;
    border-radius: 14px;
    border: 2px solid;
    color: #fff;
    font-weight: bold;
    font-size: 14px;
    line-height: 1;
  }
  .dot.is-red   { background: rgba(255,0,0,0.85);   border-color: #b00000; }
  .dot.is-blue  { background: rgba(25,118,210,0.9); border-color: #0d47a1; }
  .dot.is-pink  { background: rgba(236,64,152,0.9); border-color: #b0186b; }
  .dot.is-pinkline { background: #fff; border-color: #ec4098; color: #ec4098; }
  .dot.is-green { background: rgba(46,160,67,0.9);  border-color: #1b7a2f; }
  .dot.is-text  { background: #333; border-color: #000; font-family: Georgia, serif; }
  .dot.is-star  { border: none; color: #f0b400; font-size: 26px; text-shadow: 0 0 1px #c08a00; }

  /* 開始番号・開始文字の入力欄 */
  .toolgroup input {
    width: 44px;
    font-size: 14px;
    padding: 3px 4px;
    border: 1px solid #ddd;
    border-radius: 4px;
  }
  .toolgroup input.is-alpha { width: 34px; text-transform: uppercase; }  .toolbar .sep { width: 1px; align-self: stretch; background: #ddd; margin: 0 4px; }

  /* 画像パネルを横並び（各400px固定・折り返さず横スクロール） */
  .panels {
    display: flex;
    flex-wrap: nowrap;
    gap: var(--gap);
    align-items: flex-start;
    overflow-x: auto;      /* 横に増えたらスクロール */
    padding-bottom: 6px;   /* スクロールバーぶんの余白 */
  }
  .panel {
    flex: 0 0 400px;  /* 幅400px固定 */
    width: 400px;
    min-width: 0;
  }

  /* パネル追加ボタン（末尾に置く「＋」） */
  .add-panel {
    flex: 0 0 60px;
    align-self: flex-start;      /* 縦長画像でも伸ばさず上端に揃える */
    height: 120px;               /* 画像の高さに依存しない固定サイズ */
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px dashed #bbb;
    border-radius: 8px;
    background: #fff;
    color: #999;
    font-size: 34px;
    line-height: 1;
    cursor: pointer;
  }
  .add-panel:hover { border-color: #4caf50; color: #4caf50; background: #f6fff7; }

  /* パネル列の上に出す横スクロールバー（下のスクロールと同期） */
  .scrolltop {
    overflow-x: auto;
    overflow-y: hidden;
    margin-bottom: 4px;
  }
  .scrolltop > div { height: 1px; }

  /* キャンバス置き場（兼ドロップ領域） */
  .stage {
    position: relative;
    border: 2px dashed #bbb;
    border-radius: 8px;
    background: #fff;
    min-height: 200px;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    overflow: auto;
  }
  .stage.has-drag { border-color: #ff8787; background: #fff5f5; }
  .stage canvas {
    max-width: 100%;  /* パネル幅いっぱいに表示 */
    height: auto;
    cursor: crosshair;
    display: none;    /* 画像読み込み前は隠す */
  }
  .placeholder {
    color: #999;
    font-size: 13px;
    padding: 30px 16px;
    text-align: center;
    cursor: pointer;
    width: 100%;
  }
  /* テキストツール：クリック位置に出す入力欄 */
  .text-input {
    position: absolute;
    z-index: 5;
    min-width: 180px;
    resize: none;
    font-family: inherit;
    line-height: 1.4;
    font-size: 14px;
    padding: 4px 6px;
    border: 2px solid #333;
    border-radius: 4px;
    background: #fff;
    transform: translateY(-1.2em);   /* クリック位置が1行目の高さに来るように */
  }
  .hint { font-size: 12px; color: #888; margin-top: 8px; }
</style>
</head>
<body>
  <h1>画像マーカー</h1>

  <div class="toolbar">
    <div class="toolgroup is-star">
      <button class="tool" data-tool="star" title="画像切り替え（星マーク）"><span class="dot is-star" aria-hidden="true">★</span><span class="tool-name">画像切り替え</span></button>
    </div>
    <div class="toolgroup is-red">
      <button class="tool is-active" data-tool="circle" title="画像（赤丸＋連番）"><span class="dot is-red" data-start-for="startRed" aria-hidden="true">1</span><span class="tool-name">画像</span></button>
      <input type="number" id="startRed" class="start-num" value="1" min="0" step="1" title="赤丸の開始番号" aria-label="赤丸の開始番号">
    </div>
    <div class="toolgroup is-blue">
      <button class="tool" data-tool="blue" title="ムービー（青丸＋連番）"><span class="dot is-blue" data-start-for="startBlue" aria-hidden="true">1</span><span class="tool-name">ムービー</span></button>
      <input type="number" id="startBlue" class="start-num" value="1" min="0" step="1" title="青丸の開始番号" aria-label="青丸の開始番号">
    </div>
    <div class="toolgroup is-pink">
      <button class="tool" data-tool="pink" title="アンカーリンク（ピンク丸＋連番）"><span class="dot is-pink" data-start-for="startPink" aria-hidden="true">1</span><span class="tool-name">アンカーリンク</span></button>
      <input type="number" id="startPink" class="start-num" value="1" min="0" step="1" title="アンカーリンクの開始番号" aria-label="アンカーリンクの開始番号">
    </div>
    <div class="toolgroup is-pinkline">
      <button class="tool" data-tool="pinkTarget" title="アンカー先（ピンク枠の白丸＋連番）"><span class="dot is-pinkline" data-start-for="startPinkTarget" aria-hidden="true">1</span><span class="tool-name">アンカー先</span></button>
      <input type="number" id="startPinkTarget" class="start-num" value="1" min="0" step="1" title="アンカー先の開始番号" aria-label="アンカー先の開始番号">
    </div>
    <div class="toolgroup is-green">
      <button class="tool" data-tool="alpha" title="ボタン（緑丸＋アルファベット）"><span class="dot is-green" data-start-for="startAlpha" aria-hidden="true">A</span><span class="tool-name">ボタン</span></button>
      <input type="text" id="startAlpha" class="is-alpha" value="A" maxlength="2" size="2" title="緑丸の開始文字" aria-label="緑丸の開始文字">
    </div>
    <div class="toolgroup is-text">
      <button class="tool" data-tool="text" title="テキスト入力"><span class="dot is-text" aria-hidden="true">T</span><span class="tool-name">テキスト入力<small>Shift+Enterで改行</small></span></button>
    </div>

    <span class="sep" aria-hidden="true"></span>
    <button id="undoBtn" disabled>取り消し (Ctrl+Z)</button>
    <button id="clearBtn" disabled>全消し</button>
    <button id="saveBtn" disabled>PNGで保存</button>
  </div>

  <div class="panels" id="panels"><!-- パネルと「＋」ボタンはJSで生成 --></div>
  <p class="hint">各枠にクリックorドロップで画像を読み込み、上の丸を選んでクリックでマークを置く（丸の横の欄は開始番号・開始文字）。右の「＋」でパネルを追加（最大8枚）。番号（画像・ムービー・アンカーリンク・アンカー先はそれぞれ別）・アルファベットは全パネルを通して置いた順にそれぞれ連番になります。アンカー先はアンカーリンクとは別に開始番号を指定できます（移動先が別の画像にあるときなど）。「T」を選んでクリックすると、その場所に文字を入力できます（Enterで確定・Shift+Enterで改行・Escで取りやめ）。取り消しは全体で直前の1つ。</p>

<script>
(() => {
  "use strict";

  const INITIAL_PANELS = 3;   // 最初に出すパネル数
  const MAX_PANELS = 8;       // 追加できる上限
  const panelsEl = document.getElementById("panels");
  const undoBtn = document.getElementById("undoBtn");
  const clearBtn = document.getElementById("clearBtn");
  const saveBtn = document.getElementById("saveBtn");
  // 連番ツール → 開始番号の入力欄
  const startNums = {
    circle: document.getElementById("startRed"),
    blue: document.getElementById("startBlue"),
    pink: document.getElementById("startPink"),
    pinkTarget: document.getElementById("startPinkTarget")
  };
  const startAlpha = document.getElementById("startAlpha");
  const toolButtons = document.querySelectorAll(".tool");

  let currentTool = "circle";
  const panels = [];       // {img, canvas, ctx, stage, placeholder, fileInput}
  let marks = [];          // 全パネル共通のマーク配列 {panel, type, x, y} ※置いた順

  // ---- パネルを1つ生成して末尾（＋ボタンの手前）に追加 ----
  function addPanel() {
    if (panels.length >= MAX_PANELS) return;
    const index = panels.length;

    const panelEl = document.createElement("div");
    panelEl.className = "panel";

    const stage = document.createElement("div");
    stage.className = "stage";

    const placeholder = document.createElement("div");
    placeholder.className = "placeholder";
    placeholder.innerHTML = `画像${index + 1}<br>クリックまたはドロップで読み込み`;

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*";
    fileInput.style.display = "none";

    stage.append(placeholder, canvas);
    panelEl.append(stage, fileInput);
    panelsEl.insertBefore(panelEl, addBtn);   // ＋ボタンの手前に差し込む

    const p = { img: null, canvas, ctx, stage, placeholder, fileInput };
    panels.push(p);
    wirePanel(p, index);
    updateAddBtn();
    syncTopScrollbar();
  }

  // 上限に達したら＋ボタンを隠す
  function updateAddBtn() {
    addBtn.style.display = panels.length >= MAX_PANELS ? "none" : "";
  }

  // ---- 上部の横スクロールバー（下のパネル列とスクロール同期）----
  const topbar = document.createElement("div");
  topbar.className = "scrolltop";
  const topbarInner = document.createElement("div");
  topbar.append(topbarInner);
  panelsEl.parentNode.insertBefore(topbar, panelsEl);

  // 値が違うときだけ相手に反映（互いのscrollイベントで無限ループしない）
  topbar.addEventListener("scroll", () => {
    if (panelsEl.scrollLeft !== topbar.scrollLeft) panelsEl.scrollLeft = topbar.scrollLeft;
  });
  panelsEl.addEventListener("scroll", () => {
    if (topbar.scrollLeft !== panelsEl.scrollLeft) topbar.scrollLeft = panelsEl.scrollLeft;
  });

  // 上部バーの中身幅をパネル列の全幅に合わせる（パネル追加時に呼ぶ）
  function syncTopScrollbar() {
    topbarInner.style.width = panelsEl.scrollWidth + "px";
  }

  // ---- 「＋」ボタン（パネル追加）----
  const addBtn = document.createElement("button");
  addBtn.type = "button";
  addBtn.className = "add-panel";
  addBtn.title = "パネルを追加";
  addBtn.textContent = "＋";
  addBtn.addEventListener("click", addPanel);
  panelsEl.append(addBtn);

  // 最初に3枚ぶん生成
  for (let i = 0; i < INITIAL_PANELS; i++) addPanel();

  // マークの見た目サイズ（画像の大きさに合わせて自動調整）
  function markRadius(img) {
    if (!img) return 24;
    return Math.max(36, Math.round(Math.min(img.width, img.height) * 0.075));
  }

  // ---- 全パネルを描き直す（通し番号で描画） ----
  function redrawAll() {
    // まず各パネルの下地（画像）を描く
    for (const p of panels) {
      if (!p.img) continue;
      p.canvas.width = p.img.width;
      p.canvas.height = p.img.height;
      p.ctx.drawImage(p.img, 0, 0);
    }
    // 置いた順にマークを描く。赤・青・ピンク・アンカー先の丸とアルファベットは別々に通しでカウント
    const startA = alphaToIndex(startAlpha.value);
    const countN = { circle: 0, blue: 0, pink: 0, pinkTarget: 0 };   // 種類ごとの連番
    let countA = 0;   // アルファベット連番
    for (const m of marks) {
      const p = panels[m.panel];
      if (!p || !p.img) continue;
      const r = markRadius(p.img);
      if (m.type in countN) {
        drawCircle(p.ctx, m.x, m.y, r, String(startValue(m.type) + countN[m.type]), NUM_COLOR[m.type]);
        countN[m.type]++;
      } else if (m.type === "alpha") {
        drawCircle(p.ctx, m.x, m.y, r, indexToAlpha(startA + countA), "green");
        countA++;
      } else if (m.type === "text") {
        drawText(p.ctx, m.x, m.y, r, m.text);
      } else {
        drawStar(p.ctx, m.x, m.y, r);
      }
    }
  }

  function startValue(type) {
    return parseInt(startNums[type].value, 10) || 0;
  }

  // 連番ツール → 丸の色
  const NUM_COLOR = { circle: "red", blue: "blue", pink: "pink", pinkTarget: "pinkline" };

  // 丸の配色（text省略時は白文字）
  const CIRCLE_COLORS = {
    red:      { fill: "rgba(255,0,0,0.85)",    stroke: "#b00000" },
    blue:     { fill: "rgba(25,118,210,0.9)",  stroke: "#0d47a1" },
    pink:     { fill: "rgba(236,64,152,0.9)",  stroke: "#b0186b" },
    pinkline: { fill: "rgba(255,255,255,0.95)", stroke: "#ec4098", text: "#ec4098" },   // アンカー先：白地＋ピンク枠
    green:    { fill: "rgba(46,160,67,0.9)",   stroke: "#1b7a2f" }
  };

  // 丸＋ラベル（color: "red"/"blue"/"pink"=連番 / "green"=緑丸アルファベット）
  function drawCircle(ctx, x, y, r, label, color) {
    const c = CIRCLE_COLORS[color] || CIRCLE_COLORS.red;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = c.fill;
    ctx.fill();
    ctx.lineWidth = Math.max(2, r * 0.12);
    ctx.strokeStyle = c.stroke;
    ctx.stroke();

    ctx.fillStyle = c.text || "#fff";
    ctx.font = `bold ${Math.round(r * 1.1)}px system-ui, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, x, y + r * 0.05);
  }

  // アルファベット ⇔ 番号（0=A, 1=B, ... 25=Z, 26=AA, 27=AB ...）
  function alphaToIndex(str) {
    const s = String(str || "A").toUpperCase().replace(/[^A-Z]/g, "");
    if (!s) return 0;
    let n = 0;
    for (const ch of s) n = n * 26 + (ch.charCodeAt(0) - 64); // A=1
    return n - 1; // 0始まりに補正
  }
  function indexToAlpha(index) {
    let n = Math.max(0, index) + 1; // 1始まりへ
    let out = "";
    while (n > 0) {
      const rem = (n - 1) % 26;
      out = String.fromCharCode(65 + rem) + out;
      n = Math.floor((n - 1) / 26);
    }
    return out;
  }

  // テキスト（白文字＋黒縁取り。複数行可。クリック位置を左端・1行目の縦中央にする）
  function drawText(ctx, x, y, r, text) {
    const size = Math.round(r * 0.6);
    const lineHeight = size * 1.3;
    const lines = String(text).split("\n");
    ctx.font = `bold ${size}px system-ui, sans-serif`;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    // 縁取りを先に全行描き、その上に白文字を重ねる（行が近くても縁が白文字に被らない）
    ctx.lineWidth = Math.max(3, size * 0.2);
    ctx.strokeStyle = "#000";
    lines.forEach((line, i) => ctx.strokeText(line, x, y + i * lineHeight));
    ctx.fillStyle = "#fff";
    lines.forEach((line, i) => ctx.fillText(line, x, y + i * lineHeight));
  }

  // 星マーク（5角の星・黄色）
  function drawStar(ctx, x, y, r) {
    const spikes = 5;
    const outer = r;
    const inner = r * 0.45;
    ctx.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const rad = (i % 2 === 0) ? outer : inner;
      const ang = (Math.PI / spikes) * i - Math.PI / 2;
      const px = x + Math.cos(ang) * rad;
      const py = y + Math.sin(ang) * rad;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = "rgba(255,204,0,0.95)";
    ctx.fill();
    ctx.lineWidth = Math.max(2, r * 0.12);
    ctx.strokeStyle = "#e0a800";
    ctx.stroke();
  }

  // ---- ボタンの有効/無効 ----
  function anyImage() { return panels.some((p) => p.img); }
  function updateButtons() {
    undoBtn.disabled = marks.length === 0;
    clearBtn.disabled = marks.length === 0;
    saveBtn.disabled = !anyImage();
  }

  // ---- 画像の読み込み（指定パネルへ） ----
  function loadImageFile(panel, file) {
    if (!file || !file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const image = new Image();
      image.onload = () => {
        panel.img = image;
        panel.placeholder.style.display = "none";
        panel.canvas.style.display = "block";
        redrawAll();
        updateButtons();
      };
      image.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ---- クリック位置 → キャンバス座標（表示縮小ぶんを補正） ----
  function canvasPos(canvas, evt) {
    const rect = canvas.getBoundingClientRect();
    const sx = canvas.width / rect.width;
    const sy = canvas.height / rect.height;
    return {
      x: (evt.clientX - rect.left) * sx,
      y: (evt.clientY - rect.top) * sy
    };
  }

  // ---- テキスト入力：クリック位置に入力欄を出し、確定したらマークとして追加 ----
  let activeTextInput = null;
  function openTextInput(panel, index, evt, pos) {
    if (activeTextInput) activeTextInput.blur();   // 入力中のものは先に確定
    const stageRect = panel.stage.getBoundingClientRect();
    const input = document.createElement("textarea");
    input.className = "text-input";
    input.rows = 1;
    input.placeholder = "Enterで確定・Shift+Enterで改行";
    input.style.left = (evt.clientX - stageRect.left + panel.stage.scrollLeft) + "px";
    input.style.top = (evt.clientY - stageRect.top + panel.stage.scrollTop) + "px";
    panel.stage.append(input);
    activeTextInput = input;

    let done = false;
    const finish = (commit) => {
      if (done) return;
      done = true;
      const text = input.value.replace(/\s+$/, "").replace(/^\s*\n/, "");   // 前後の空行は捨てる
      input.remove();
      activeTextInput = null;
      if (!commit || !text) return;
      marks.push({ panel: index, type: "text", x: pos.x, y: pos.y, text });
      redrawAll();
      updateButtons();
    };
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {   // 変換確定のEnterは除く
        e.preventDefault();
        finish(true);
      } else if (e.key === "Escape") finish(false);
    });
    // 行数に合わせて入力欄の高さを伸ばす
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
    });
    input.addEventListener("blur", () => finish(true));
    setTimeout(() => input.focus());   // クリック直後のフォーカス移動に負けないよう次の順番で
  }

  // ---- パネルごとのイベント配線 ----
  function wirePanel(panel, index) {
    // クリックでマーク設置
    panel.canvas.addEventListener("click", (e) => {
      if (!panel.img) return;
      const pos = canvasPos(panel.canvas, e);
      if (currentTool === "text") {
        openTextInput(panel, index, e, pos);
        return;
      }
      marks.push({ panel: index, type: currentTool, x: pos.x, y: pos.y });
      redrawAll();
      updateButtons();
    });

    // 空枠クリックでファイル選択
    panel.placeholder.addEventListener("click", () => panel.fileInput.click());
    panel.fileInput.addEventListener("change", (e) => loadImageFile(panel, e.target.files[0]));

    // ドラッグ＆ドロップ
    panel.stage.addEventListener("dragover", (e) => {
      e.preventDefault();
      panel.stage.classList.add("has-drag");
    });
    panel.stage.addEventListener("dragleave", () => panel.stage.classList.remove("has-drag"));
    panel.stage.addEventListener("drop", (e) => {
      e.preventDefault();
      panel.stage.classList.remove("has-drag");
      loadImageFile(panel, e.dataTransfer.files[0]);
    });
  }

  // ---- 取り消し・全消し ----
  function undo() {
    if (marks.length === 0) return;
    marks.pop();
    redrawAll();
    updateButtons();
  }
  undoBtn.addEventListener("click", undo);

  clearBtn.addEventListener("click", () => {
    marks = [];
    redrawAll();
    updateButtons();
  });

  // ---- 保存：画像のあるパネルを1枚ずつPNGで書き出す ----
  saveBtn.addEventListener("click", () => {
    let n = 0;
    panels.forEach((p, i) => {
      if (!p.img) return;
      n++;
      const a = document.createElement("a");
      a.download = `${String(i + 1).padStart(2, "0")}.png`;   // 01.png, 02.png …
      a.href = p.canvas.toDataURL("image/png");
      a.click();
    });
  });

  // ---- ツール切り替え ----
  toolButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      currentTool = btn.dataset.tool;
      toolButtons.forEach((b) => b.classList.toggle("is-active", b === btn));
    });
  });

  // 開始番号・開始文字を変えたら描き直す
  // ボタンの丸にも開始値を表示する
  function updateStartLabels() {
    for (const type in startNums) {
      document.querySelector(`[data-start-for="${startNums[type].id}"]`).textContent = startValue(type);
    }
    document.querySelector('[data-start-for="startAlpha"]').textContent = indexToAlpha(alphaToIndex(startAlpha.value));
  }
  for (const input of [...Object.values(startNums), startAlpha]) {
    input.addEventListener("input", () => { updateStartLabels(); redrawAll(); });
  }

  // Ctrl+Z で取り消し
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, textarea")) return;   // 入力欄の中ではその欄の取り消しを優先
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
      e.preventDefault();
      undo();
    }
  });
})();
</script>
</body>
</html>
